<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DFCI Patrol">
<title>DFCI Patrol — RCSC-CCFF Lorgues</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    font-family: -apple-system, "SF Pro Display", Helvetica, Arial, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }

  /* ---------- écran de démarrage ---------- */
  #startScreen {
    position: fixed; inset: 0; background: #000; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px; box-sizing: border-box;
  }
  #startScreen img { width: 34vh; height: 34vh; max-width: 220px; max-height: 220px; }
  #startScreen .appname { color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
  #startScreen button {
    background: #34c759; color: #000; font-size: 19px; font-weight: 700;
    border: none; border-radius: 14px; padding: 14px 30px; margin-top: 6px;
  }
  #startScreen p { color: #8e8e93; font-size: 14px; text-align: center; padding: 0 30px; margin: 0; max-width: 500px; }

  /* ---------- rotation ---------- */
  #rotate {
    position: fixed; inset: 0; background: #000; color: #fff; z-index: 25;
    display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 22px; padding: 30px; box-sizing: border-box;
  }
  @media (orientation: portrait) {
    #app { display: none !important; }
    #rotate { display: flex; }
  }

  /* ---------- écran principal ---------- */
  #app { height: 100%; display: none; flex-direction: column; }

  #statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px 0 24px; box-sizing: border-box;
  }
  #statusbar .orgTag { display: flex; align-items: center; gap: 8px; }
  #statusbar .orgTag img { width: 26px; height: 26px; }
  #statusbar .orgTag span { color: #8e8e93; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }

  .indicators { display: flex; gap: 18px; }
  .indicator { display: flex; align-items: center; gap: 6px; }
  .indicator .txt { color: #8e8e93; font-size: 13px; font-family: "SF Mono", Menlo, monospace; }
  .indicator .txt.ok { color: #34c759; }
  .indicator .txt.warn { color: #ff9500; }
  .indicator .txt.bad { color: #ff453a; }

  .dots { display: flex; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3a3a3a; }
  .dots i.on.ok { background: #34c759; }
  .dots i.on.warn { background: #ff9500; }
  .dots i.on.bad { background: #ff453a; }

  #mainRow { flex: 1; display: flex; align-items: center; padding: 0 30px; box-sizing: border-box; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .divider { width: 1px; align-self: stretch; background: #333; margin: 26px 24px; }

  .label { color: #ff9500; font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-bottom: 6px; }
  .street { color: #fff; font-size: 40px; font-weight: 800; line-height: 1.05; }
  .city { color: #8e8e93; font-size: 19px; margin-top: 6px; }
  .dfci { color: #34c759; font-size: 56px; font-weight: 900; font-family: "SF Mono", Menlo, monospace; }

  /* ---------- état "perdu" par colonne ---------- */
  .col.lost .street, .col.lost .dfci { color: #3a3a3a; }
  .col.lost .city { display: none; }
  .col-banner {
    display: none; align-items: center; gap: 10px; background: #2a0d0d; border: 2px solid #ff453a;
    border-radius: 12px; padding: 7px 14px; margin-bottom: 12px; align-self: flex-start;
  }
  .col.lost .col-banner { display: flex; }
  .col-banner .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff453a; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  .col-banner span { color: #ff453a; font-size: 14px; font-weight: 800; letter-spacing: 0.5px; }
</style>
</head>

<script>
// ================== Conversion géodésique : WGS84 -> NTF -> Lambert II étendu -> grille DFCI ==================
const GRS80 = { a: 6378137.0, e2: 0.00669438002290 };
const CLARKE1880 = { a: 6378249.2, e2: 0.006803487646 };

function geoToGeocentric(lat, lon, h, ell) {
  const latR = lat * Math.PI / 180, lonR = lon * Math.PI / 180;
  const n = ell.a / Math.sqrt(1 - ell.e2 * Math.sin(latR) ** 2);
  return {
    x: (n + h) * Math.cos(latR) * Math.cos(lonR),
    y: (n + h) * Math.cos(latR) * Math.sin(lonR),
    z: (n * (1 - ell.e2) + h) * Math.sin(latR)
  };
}
function geocentricToGeo(x, y, z, ell) {
  const lon = Math.atan2(y, x);
  const p = Math.sqrt(x * x + y * y);
  let lat = Math.atan2(z, p * (1 - ell.e2));
  for (let i = 0; i < 10; i++) {
    const n = ell.a / Math.sqrt(1 - ell.e2 * Math.sin(lat) ** 2);
    lat = Math.atan2(z + ell.e2 * n * Math.sin(lat), p);
  }
  return { lat: lat * 180 / Math.PI, lon: lon * 180 / Math.PI };
}
function wgs84ToNTF(lat, lon) {
  const g = geoToGeocentric(lat, lon, 100, GRS80);
  return geocentricToGeo(g.x + 168, g.y + 60, g.z - 320, CLARKE1880);
}
function lambertForward(latDeg, lonDeg, ell, n, c, lambda0Deg, xs, ys) {
  const lat = latDeg * Math.PI / 180, lon = lonDeg * Math.PI / 180;
  const lambda0 = lambda0Deg * Math.PI / 180;
  const e = Math.sqrt(ell.e2);
  const l = Math.log(Math.tan(Math.PI / 4 + lat / 2)) - (e / 2) * Math.log((1 + e * Math.sin(lat)) / (1 - e * Math.sin(lat)));
  const r = c * Math.exp(-n * l);
  const theta = n * (lon - lambda0);
  return { x: xs + r * Math.sin(theta), y: ys - r * Math.cos(theta) };
}
function wgs84ToLambertIIEtendu(lat, lon) {
  const ntf = wgs84ToNTF(lat, lon);
  return lambertForward(ntf.lat, ntf.lon, CLARKE1880, 0.7289686274, 11745793.39, 2.337229166667, 600000.0, 8199695.768);
}

const LETTERS12 = ["A","B","C","D","E","F","G","H","K","L","M","N"];
const LETTERS10 = ["A","B","C","D","E","F","G","H","K","L"];

function dfciCode(lat, lon) {
  const { x, y } = wgs84ToLambertIIEtendu(lat, lon);
  const xLocal = x, yLocal = y - 1500000;
  if (xLocal < 0 || yLocal < 0) return null;

  const idx100X = Math.floor(xLocal / 100000);
  const idx100Y = Math.floor(yLocal / 100000);
  if (idx100X >= LETTERS12.length || idx100Y >= LETTERS12.length) return null;
  const square100 = LETTERS12[idx100X] + LETTERS12[idx100Y];

  const restX100 = xLocal % 100000, restY100 = yLocal % 100000;
  const idx20X = Math.floor(restX100 / 20000), idx20Y = Math.floor(restY100 / 20000);
  const square20 = "" + (idx20X * 2) + (idx20Y * 2);

  const restX20 = restX100 % 20000, restY20 = restY100 % 20000;
  const idx2X = Math.floor(restX20 / 2000), idx2Y = Math.floor(restY20 / 2000);
  if (idx2X >= LETTERS10.length || idx2Y > 9) return null;
  const square2 = LETTERS10[idx2X] + idx2Y;

  const restX2 = restX20 % 2000, restY2 = restY20 % 2000;
  let subZone;
  if (restX2 > 500 && restX2 < 1500 && restY2 > 500 && restY2 < 1500) subZone = 5;
  else if (restX2 < 1000 && restY2 >= 1000) subZone = 1;      // Nord-Ouest
  else if (restX2 >= 1000 && restY2 >= 1000) subZone = 2;     // Nord-Est
  else if (restX2 >= 1000 && restY2 < 1000) subZone = 3;      // Sud-Est
  else subZone = 4;                                            // Sud-Ouest

  return square100 + square20 + square2 + "." + subZone;
}

// ================== État global ==================
const GPS_TIMEOUT_MS = 8000;     // délai sans position avant de considérer le GPS perdu
const GEOCODE_THROTTLE_MS = 6000; // fréquence max des requêtes Nominatim

let lastPositionTime = 0;
let lastGeocodeTime = 0;
let lastKnownAccuracy = null;

// ================== Réseau ==================
function setNetworkState(online) {
  const icon = document.getElementById("netIcon");
  const text = document.getElementById("netText");
  if (online) {
    icon.setAttribute("fill", "#34c759");
    text.textContent = "En ligne";
    text.className = "txt ok";
  } else {
    icon.setAttribute("fill", "#ff453a");
    text.textContent = "Hors ligne";
    text.className = "txt bad";
  }
  updateLostStates();
}
window.addEventListener("online", () => setNetworkState(true));
window.addEventListener("offline", () => setNetworkState(false));

// ================== GPS : indicateur qualité ==================
function updateGpsIndicator(accuracy) {
  const dots = document.querySelectorAll("#gpsDots i");
  const text = document.getElementById("gpsText");
  let level, cls, label;
  if (accuracy <= 15) { level = 3; cls = "ok"; label = "GPS excellent"; }
  else if (accuracy <= 30) { level = 2; cls = "warn"; label = "GPS correct"; }
  else { level = 1; cls = "bad"; label = "GPS faible"; }

  dots.forEach((dot, i) => {
    dot.className = i < level ? `on ${cls}` : "";
  });
  text.textContent = `${label} (±${Math.round(accuracy)} m)`;
  text.className = `txt ${cls}`;
}

// ================== Gestion des états "perdu" par colonne ==================
function updateLostStates() {
  const gpsLost = (Date.now() - lastPositionTime) > GPS_TIMEOUT_MS;
  const networkLost = !navigator.onLine;

  const colStreet = document.getElementById("colStreet");
  const colDfci = document.getElementById("colDfci");
  const bannerStreetTxt = document.getElementById("bannerStreetTxt");
  const bannerDfciTxt = document.getElementById("bannerDfciTxt");

  if (gpsLost) {
    // Plus aucune position fiable : les deux colonnes basculent en alerte
    colStreet.classList.add("lost");
    colDfci.classList.add("lost");
    bannerStreetTxt.textContent = "RÉSEAU PERDU";
    bannerDfciTxt.textContent = "GPS PERDU";
    const dots = document.querySelectorAll("#gpsDots i");
    dots.forEach(d => d.className = "");
    document.getElementById("gpsText").textContent = "GPS perdu";
    document.getElementById("gpsText").className = "txt bad";
  } else if (networkLost) {
    // Le DFCI ne dépend que du GPS : il reste affiché normalement
    colStreet.classList.add("lost");
    colDfci.classList.remove("lost");
    bannerStreetTxt.textContent = "RÉSEAU PERDU";
  } else {
    colStreet.classList.remove("lost");
    colDfci.classList.remove("lost");
  }
}
setInterval(updateLostStates, 1000);

// ================== Reverse geocoding (OpenStreetMap Nominatim, gratuit) ==================
async function updateStreet(lat, lon) {
  const now = Date.now();
  if (now - lastGeocodeTime < GEOCODE_THROTTLE_MS) return;
  if (!navigator.onLine) return;
  lastGeocodeTime = now;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=17`);
    const data = await res.json();
    const a = data.address || {};
    document.getElementById("street").textContent = a.road || a.pedestrian || a.hamlet || "Rue inconnue";
    document.getElementById("city").textContent = a.village || a.town || a.city || a.municipality || "";
  } catch (e) { /* pas de réseau : on garde la dernière valeur affichée */ }
}

// ================== Position GPS ==================
function onPosition(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  lastPositionTime = Date.now();
  lastKnownAccuracy = accuracy;

  const code = dfciCode(latitude, longitude);
  document.getElementById("dfci").textContent = code || "—";

  updateGpsIndicator(accuracy);
  updateLostStates();
  updateStreet(latitude, longitude);
}

function onPositionError(err) {
  // Le compteur GPS_TIMEOUT_MS gère l'affichage "GPS perdu" automatiquement,
  // pas besoin de traiter l'erreur ici au cas par cas.
}

function startApp() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("app").style.display = "flex";

  setNetworkState(navigator.onLine);

  if (!("geolocation" in navigator)) {
    document.getElementById("street").textContent = "GPS non disponible";
    return;
  }
  navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 15000
  });
}
</script>
